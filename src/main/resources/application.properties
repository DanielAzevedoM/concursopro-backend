spring.application.name=api

# Configuração do PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/concurso_db
spring.datasource.username=concurso_user
spring.datasource.password=concurso_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true

# Configurações do Servidor
server.port=8080

# JWT Token
jwt.secret=bXktc3VwZXItc2VjcmV0LWtleS10aGF0LWlzLWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmctZm9yLWp3dAo=
